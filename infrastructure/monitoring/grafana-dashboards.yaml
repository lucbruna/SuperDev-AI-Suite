apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  superdev-overview.json: |
    {
      "dashboard": {
        "title": "SuperDev Overview",
        "tags": ["superdev", "overview"],
        "timezone": "utc",
        "panels": [
          {
            "id": 1,
            "title": "API Request Rate",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])",
                "legendFormat": "{{method}} {{route}}"
              }
            ],
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}
          },
          {
            "id": 2,
            "title": "API Latency (p95)",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route))",
                "legendFormat": "{{route}}"
              }
            ],
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}
          },
          {
            "id": 3,
            "title": "Active Workflows",
            "type": "stat",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "workflows_active",
                "legendFormat": "Active"
              }
            ],
            "gridPos": {"x": 0, "y": 8, "w": 6, "h": 4}
          },
          {
            "id": 4,
            "title": "Workflow Success Rate",
            "type": "gauge",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "workflows_completed_total / (workflows_completed_total + workflows_failed_total) * 100",
                "legendFormat": "Success %"
              }
            ],
            "gridPos": {"x": 6, "y": 8, "w": 6, "h": 4}
          },
          {
            "id": 5,
            "title": "Agent Executions",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "rate(agent_executions_total[5m])",
                "legendFormat": "{{type}} - {{status}}"
              }
            ],
            "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}
          },
          {
            "id": 6,
            "title": "Verification Loop Success Rate",
            "type": "gauge",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "verification_success_total / (verification_success_total + verification_failed_total) * 100",
                "legendFormat": "Success %"
              }
            ],
            "gridPos": {"x": 0, "y": 12, "w": 6, "h": 4}
          },
          {
            "id": 7,
            "title": "Knowledge Base Queries",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "rate(kb_queries_total[5m])",
                "legendFormat": "{{type}}"
              }
            ],
            "gridPos": {"x": 6, "y": 12, "w": 12, "h": 8}
          },
          {
            "id": 8,
            "title": "Active Plugins",
            "type": "stat",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "plugins_active",
                "legendFormat": "Active"
              }
            ],
            "gridPos": {"x": 18, "y": 12, "w": 6, "h": 4}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      },
      "overwrite": true
    }
  }