<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter superdev.**>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

<match superdev.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name superdev
  type_name _doc
  logstash_format true
  logstash_prefix superdev
  <buffer>
    flush_interval 5s
  </buffer>
</match>
