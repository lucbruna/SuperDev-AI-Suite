http:
  routers:
    backend:
      rule: "Host(`api.superdev.io`)"
      entryPoints:
        - websecure
      service: backend
      tls:
        certResolver: letsencrypt

    frontend:
      rule: "Host(`app.superdev.io`)"
      entryPoints:
        - websecure
      service: frontend
      tls:
        certResolver: letsencrypt

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8000"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
