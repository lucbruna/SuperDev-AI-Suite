apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superdev-infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: superdev
  source:
    repoURL: https://github.com/superdev/superdev
    targetRevision: HEAD
    path: infrastructure/helm/superdev
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      parameters:
        - name: postgresql.enabled
          value: "true"
        - name: redis.enabled
          value: "true"
        - name: prometheus.enabled
          value: "true"
        - name: grafana.enabled
          value: "true"
        - name: jaeger.enabled
          value: "true"
        - name: certManager.enabled
          value: "true"
        - name: nginxIngress.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: superdev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superdev-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: superdev
  source:
    repoURL: https://github.com/superdev/superdev
    targetRevision: HEAD
    path: infrastructure/kubernetes/base
    kustomize:
      images:
        - ghcr.io/superdev/superdev-api:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: superdev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: superdev-environments
  namespace: argocd
spec:
  generators:
    - matrix:
      generators:
        - git:
            repoURL: https://github.com/superdev/superdev
            revision: HEAD
            directories:
              - path: infrastructure/kubernetes/overlays/*
        - clusters: {}
  template:
    metadata:
      name: '{{path.basename}}-{{name}}'
    spec:
      project: superdev
      source:
        repoURL: https://github.com/superdev/superdev
        targetRevision: HEAD
        path: '{{path}}'
        kustomize:
          images:
            - ghcr.io/superdev/superdev-api:latest
      destination:
        server: '{{server}}'
        namespace: superdev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: superdev
  source:
    repoURL: https://github.com/superdev/superdev
    targetRevision: HEAD
    path: infrastructure/monitoring
    kustomize:
      images:
        - ghcr.io/superdev/superdev-api:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: superdev-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m