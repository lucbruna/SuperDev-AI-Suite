apiVersion: v1
kind: ConfigMap
metadata:
  name: superdev-config
  namespace: superdev
data:
  DATABASE_URL: "postgresql://superdev:superdev@postgres:5432/superdev"
  REDIS_URL: "redis://redis:6379/0"
  BACKEND_PORT: "8000"
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: superdev-backend
  namespace: superdev
spec:
  selector:
    app: superdev-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdev-backend
  namespace: superdev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: superdev-backend
  template:
    metadata:
      labels:
        app: superdev-backend
    spec:
      containers:
        - name: backend
          image: superdev/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: superdev-config
          livenessProbe:
            httpGet:
              path: /api/v1/health/alive
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi