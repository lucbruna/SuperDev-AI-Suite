apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: superdev-prod
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
namePrefix: prod-
labels:
  - pairs:
      environment: production