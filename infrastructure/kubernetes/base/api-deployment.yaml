apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdev-api
  namespace: superdev
  labels:
    app.kubernetes.io/name: superdev-api
    app.kubernetes.io/component: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: superdev-api
  namespace: superdev
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: superdev-api
  namespace: superdev
subjects:
  - kind: ServiceAccount
    name: superdev-api
    namespace: superdev
roleRef:
  kind: Role
  name: superdev-api
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superdev-config
  namespace: superdev
data:
  APP_NAME: "SuperDev AI Suite"
  APP_VERSION: "5.0.0"
  APP_ENVIRONMENT: "production"
  APP_DEBUG: "false"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  APP_WORKERS: "4"
  APP_LOG_LEVEL: "INFO"
  API_PREFIX: "/api/v1"
  DOCS_URL: "/docs"
  OPENAPI_URL: "/openapi.json"
  LOG_FORMAT: "json"
  LOG_OUTPUT: "stdout"
  CORRELATION_ID_HEADER: "X-Request-ID"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  FEATURE_KNOWLEDGE_BASE: "true"
  FEATURE_VERIFICATION_LOOP: "true"
  FEATURE_PLUGIN_MARKETPLACE: "true"
  FEATURE_WORKFLOW_ENGINE: "true"
  FEATURE_MULTI_TENANT: "true"
  FEATURE_RATE_LIMITING: "true"
  FEATURE_OBSERVABILITY: "true"
  FEATURE_SUPPLY_CHAIN_SECURITY: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: superdev-secrets
  namespace: superdev
type: Opaque
stringData:
  # These will be replaced by external-secrets or sealed-secrets
  DATABASE_URL: "postgresql+asyncpg://superdev:changeme@postgresql.superdev-database:5432/superdev"
  REDIS_URL: "redis://:changeme@redis.superdev:6379/0"
  JWT_SECRET_KEY: "changeme-256-bit-secret-key"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  OLLAMA_BASE_URL: "http://ollama:11434"
  OPENROUTER_API_KEY: ""
  SENTRY_DSN: ""
  GITHUB_OAUTH_CLIENT_ID: ""
  GITHUB_OAUTH_CLIENT_SECRET: ""
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdev-api
  namespace: superdev
  labels:
    app.kubernetes.io/name: superdev-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: superdev
    app.kubernetes.io/managed-by: argocd
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: superdev-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superdev-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: superdev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        # Reload when config changes
        checksum/config: "{{ .Values.configChecksum }}"
        checksum/secrets: "{{ .Values.secretsChecksum }}"
    spec:
      serviceAccountName: superdev-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/superdev/superdev-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: superdev-config
            - secretRef:
                name: superdev-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: superdev-api
  namespace: superdev
  labels:
    app.kubernetes.io/name: superdev-api
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: superdev-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: superdev-api-hpa
  namespace: superdev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: superdev-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: superdev-api
  namespace: superdev-monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: superdev-api
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics