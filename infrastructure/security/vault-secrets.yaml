apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-role-binding
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.superdev.example.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: superdev-role
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: superdev-secrets
  namespace: superdev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: superdev-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: superdev/production/database
        property: url
    - secretKey: redis-url
      remoteRef:
        key: superdev/production/redis
        property: url
    - secretKey: jwt-secret-key
      remoteRef:
        key: superdev/production/auth
        property: jwt-secret
    - secretKey: openai-api-key
      remoteRef:
        key: superdev/production/ai
        property: openai
    - secretKey: anthropic-api-key
      remoteRef:
        key: superdev/production/ai
        property: anthropic
    - secretKey: gemini-api-key
      remoteRef:
        key: superdev/production/ai
        property: gemini
    - secretKey: openrouter-api-key
      remoteRef:
        key: superdev/production/ai
        property: openrouter
    - secretKey: sentry-dsn
      remoteRef:
        key: superdev/production/monitoring
        property: sentry-dsn
    - secretKey: github-oauth-client-id
      remoteRef:
        key: superdev/production/oauth/github
        property: client-id
    - secretKey: github-oauth-client-secret
      remoteRef:
        key: superdev/production/oauth/github
        property: client-secret
    - secretKey: google-oauth-client-id
      remoteRef:
        key: superdev/production/oauth/google
        property: client-id
    - secretKey: google-oauth-client-secret
      remoteRef:
        key: superdev/production/oauth/google
        property: client-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: superdev-db-secret
  namespace: superdev-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: superdev-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: superdev/production/database
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: superdev-redis-secret
  namespace: superdev-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: superdev-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: superdev/production/redis
        property: password
    - secretKey: sentinel-password
      remoteRef:
        key: superdev/production/redis
        property: sentinel-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: elasticsearch-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: elasticsearch-master-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: superdev/production/elasticsearch
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-oauth
  namespace: superdev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: superdev/production/oauth/github
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: superdev/production/oauth/github
        property: client-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: google-oauth
  namespace: superdev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: google-oauth
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: superdev/production/oauth/google
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: superdev/production/oauth/google
        property: client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: cosign-password
  namespace: superdev
type: Opaque
stringData:
  COSIGN_PASSWORD: "changeme"
---
apiVersion: v1
kind: Secret
metadata:
  name: pypi-token
  namespace: superdev
type: Opaque
stringData:
  PYPI_API_TOKEN: "pypi-..."
---
apiVersion: v1
kind: Secret
metadata:
  name: npm-token
  namespace: superdev
type: Opaque
stringData:
  NPM_TOKEN: "npm_..."