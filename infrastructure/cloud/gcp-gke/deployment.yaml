apiVersion: apps/v1
kind: Deployment
metadata:
  name: superdev-backend
  namespace: superdev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: superdev-backend
  template:
    metadata:
      labels:
        app: superdev-backend
    spec:
      containers:
        - name: backend
          image: gcr.io/superdev/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superdev-secrets
                  key: database-url
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
