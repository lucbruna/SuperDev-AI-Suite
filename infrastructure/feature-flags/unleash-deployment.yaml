apiVersion: v1
kind: Namespace
metadata:
  name: unleash
  labels:
    app.kubernetes.io/name: unleash
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unleash
  namespace: unleash
---
apiVersion: v1
kind: Secret
metadata:
  name: unleash-secrets
  namespace: unleash
type: Opaque
stringData:
  DATABASE_URL: "postgresql://unleash:changeme@postgresql.superdev-database:5432/unleash"
  ADMIN_TOKEN: "changeme"
  SESSION_SECRET: "changeme"
  SIGNUP_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unleash-config
  namespace: unleash
data:
  UNLEASH_LOG_LEVEL: "info"
  UNLEASH_SERVER_PORT: "4242"
  UNLEASH_SERVER_HOST: "0.0.0.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash
  namespace: unleash
  labels:
    app.kubernetes.io/name: unleash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unleash
  template:
    metadata:
      labels:
        app: unleash
    spec:
      serviceAccountName: unleash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: unleash
          image: unleashorg/unleash-server:latest
          ports:
            - containerPort: 4242
              name: http
          envFrom:
            - configMapRef:
                name: unleash-config
            - secretRef:
                name: unleash-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4242
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unleash
  namespace: unleash
spec:
  type: ClusterIP
  ports:
    - port: 4242
      targetPort: 4242
      name: http
  selector:
    app: unleash
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unleash
  namespace: unleash
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - unleash.superdev.example.com
      secretName: unleash-tls
  rules:
    - host: unleash.superdev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unleash
                port:
                  number: 4242