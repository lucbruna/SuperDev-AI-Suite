services:
  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
    command: uvicorn backend.app:create_app --reload --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
    command: npm run dev

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: superdev
      POSTGRES_USER: superdev
      POSTGRES_PASSWORD: superdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdev"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
