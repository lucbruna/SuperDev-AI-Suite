# ── Horizontal Pod Autoscaler ─────────────────────────
horizontalPodAutoscaler:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
        - type: Percent
          value: 100
          periodSeconds: 15

# ── Pod Resource Requests/Limits ──────────────────────
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# ── Topology Spread Constraints ───────────────────────
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# ── Pod Anti-Affinity ────────────────────────────────
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - superdev
          topologyKey: kubernetes.io/hostname

# ── Node Selector ─────────────────────────────────────
nodeSelector:
  kubernetes.io/os: linux
  node-type: compute

# ── Tolerations ───────────────────────────────────────
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: dedicated
    operator: Equal
    value: superdev
    effect: NoSchedule