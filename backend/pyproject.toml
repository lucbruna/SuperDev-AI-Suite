[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superdev-backend"
version = "6.0.0"
description = "SuperDev AI Suite - Backend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SuperDev Team" }]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.6",
    "pgvector>=0.2.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.20.0",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped async fixtures (e.g. backend/tests + root tests/conftest.py
# async_engine) require a session event loop; align the test loop scope too so
# every async test runs on the same loop (no cross-loop binding errors).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
