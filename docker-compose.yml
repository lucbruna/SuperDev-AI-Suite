services:
  # ── Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://superdev:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/superdev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env (openssl rand -hex 32)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env (openssl rand -hex 32)}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ISSUER=${JWT_ISSUER:-superdev}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-superdev-api}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - CORS_ORIGINS=["http://localhost:3000"]
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOTA: volume mount removido intencionalmente.
    # No Windows Docker Desktop, bind mounts via gRPC FUSE causam D-state
    # (uninterruptible sleep) no processo uvicorn, impedindo reqs.
    # O Dockerfile já copia todos os módulos necessarios na imagem.
    # Para desenvolvimento com hot-reload, use docker-compose.dev.yml.
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  # ── Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    # Volume mount removido (mesmo motivo do backend: Windows Docker Desktop
    # bind mounts causam D-state no processo principal).
    # Para desenvolvimento com hot-reload, use docker-compose.dev.yml.

  # ── Banco de Dados ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-superdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (openssl rand -hex 16)}
      POSTGRES_DB: ${POSTGRES_DB:-superdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superdev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Cache ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Postgres Exporter (for Prometheus metrics) ──────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://superdev:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/superdev?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Monitoramento ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env (openssl rand -hex 16)}
    volumes:
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana

  # ── Reverse Proxy ────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - ./infrastructure/network/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/network/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
