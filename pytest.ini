[pytest]
testpaths = tests/unit tests/integration tests/runtime_engine tests/e2e
asyncio_mode = auto
# Aligned session loop scope for BOTH fixtures and tests: the suite's
# async_engine fixture is session-scoped (pytest-asyncio requires fixture loop
# scope >= fixture scope), so tests MUST run on the same session event loop.
# The old mix (fixture=session / test=function) bound the engine to the
# session loop while each test ran on a fresh per-function loop, causing
# "Task attached to a different loop" / "Event loop is closed" errors.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
addopts = -v --cov=backend --cov-report=term-missing
