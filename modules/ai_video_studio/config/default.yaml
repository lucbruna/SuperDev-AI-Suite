# AI Video Studio - Default Configuration
# Override any value with VIDEO_STUDIO_* environment variables

app:
  name: "AI Video Studio"
  version: "1.0.0"
  debug: false
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"

database:
  url: "postgresql+asyncpg://superdev:superdev@localhost:5432/superdev"
  pool_size: 20
  max_overflow: 40
  echo: false

redis:
  url: "redis://localhost:6379/0"
  max_connections: 50

storage:
  local_path: "storage/video_studio"
  max_upload_size_mb: 5000
  temp_path: "storage/video_studio/temp"
  export_path: "storage/video_studio/exports"
  asset_path: "storage/video_studio/assets"

render:
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  max_concurrent_renders: 4
  gpu_enabled: false
  gpu_device: "0"
  chunk_size: 100
  preview_enabled: true

ai:
  provider: "ollama"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "llama3"
  openai_model: "gpt-4"
  temperature: 0.7
  max_retries: 3

publisher:
  s3_region: "us-east-1"

# Default render presets
presets:
  youtube_1080p:
    resolution: "1920x1080"
    aspect_ratio: "16:9"
    frame_rate: 30
    video_codec: "libx264"
    audio_codec: "aac"
    container: "mp4"
    crf: 23
    preset: "medium"

  youtube_4k:
    resolution: "3840x2160"
    aspect_ratio: "16:9"
    frame_rate: 30
    video_codec: "libx265"
    audio_codec: "aac"
    container: "mp4"
    crf: 20
    preset: "slow"

  tiktok_vertical:
    resolution: "1920x1080"
    aspect_ratio: "9:16"
    frame_rate: 30
    video_codec: "libx264"
    audio_codec: "aac"
    container: "mp4"
    crf: 23
    preset: "medium"

  instagram_reel:
    resolution: "1920x1080"
    aspect_ratio: "9:16"
    frame_rate: 30
    video_codec: "libx264"
    audio_codec: "aac"
    container: "mp4"
    crf: 23
    preset: "medium"

  cinema_4k:
    resolution: "4096x2160"
    aspect_ratio: "21:9"
    frame_rate: 24
    video_codec: "prores_ks"
    audio_codec: "pcm_s24le"
    container: "mov"
    crf: 0
    preset: "medium"
