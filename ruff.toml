line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PTH"]
ignore = [
    "E501",   # line-too-long — enforced by formatter, not checker
    "E402",   # module-import-not-at-top — many modules need lazy/safe imports
    "B008",   # function-call-in-default-argument — FastAPI Depends() pattern
    "B027",   # empty-method-without-abstract-decorator
    "ARG002", # unused-method-argument — common in callbacks/handlers
    "ARG001", # unused-function-argument — common in callbacks/handlers
    "ARG005", # unused-lambda-argument — common in lambdas
    "PTH",    # pathlib建议 — functional but noisy, defer migration
    "E741",   # ambiguous-variable-name — mathematical/algorithmic code
    "B904",   # raise-without-from-inside-except — style preference
    "N815",   # mixed-case-variable-in-class-scope — third-party API naming
    "N803",   # invalid-argument-name — API query params use camelCase
    "N801",   # invalid-class-name — third-party naming conventions
    "N814",   # camelcase-imported-as-constant
    "N817",   # camelcase-imported-as-acronym
    "N818",   # error-suffix-on-exception-name
    "SIM105", # suppressible-exception — contextlib.suppress not always clearer
    "F811",   # redefined-while-unused — re-export pattern
    "F402",   # import-shadowed-by-loop-var — common in form handlers
    "B039",   # mutable-contextvar-default
    "E702",   # multiple-statements-on-one-line-colon
    "SIM102", # collapsible-if — readability preference
    "E701",   # multiple-statements-on-one-line-colon — one-liner defs
    "B007",   # unused-loop-control-variable
    "I001",   # unsorted-imports — noisy in __init__ re-exports
    "F821",   # undefined-name — runtime-resolved names (SQLAlchemy, __init__ re-exports)
]

[lint.per-file-ignores]
# SQLAlchemy string-based relationship() references resolve at runtime
"backend/database/models/*.py" = ["F821"]
# N999 fires on package __init__.py files because the project root folder
# name "SuperDev" is not snake_case (environmental, project-wide)
"**/__init__.py" = ["N999", "F401", "F403"]
# Uppercase module names (SLA.py etc.) — external API naming conventions
"ai/enterprise/contracts/SLA.py" = ["N999"]
# Legacy files with lots of unused imports (cleanup ongoing)
"ai/**/*.py" = ["F401", "F403"]
# Deprecated typing imports — still used widely, defer migration
"**/*.py" = ["UP035"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
