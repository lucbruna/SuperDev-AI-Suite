line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PTH"]

[lint.per-file-ignores]
# SQLAlchemy string-based relationship() references resolve at runtime
"backend/database/models/*.py" = ["F821"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
