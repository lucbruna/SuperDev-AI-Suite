[project]
name = "superdev"
version = "6.0.0"
description = "Enterprise-grade AI-powered development platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SuperDev AI Suite" },
]
keywords = ["ai", "development", "platform", "agents", "workflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "fastapi>=0.109,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "redis>=5.0,<6.0",
    "httpx>=0.26,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-multipart>=0.0.7,<1.0",
    "bcrypt>=4.1,<5.0",
    "pyjwt>=2.8,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "opentelemetry-api>=1.22,<2.0",
    "opentelemetry-sdk>=1.22,<2.0",
    "prometheus-client>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<5.0",
    "httpx>=0.26,<1.0",
    "ruff>=0.2,<1.0",
    "mypy>=1.8,<3.0",
    "pre-commit>=3.6,<4.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PTH"]
ignore = [
    "E501",   # line-too-long — enforced by formatter, not checker
    "E402",   # module-import-not-at-top — many modules need lazy/safe imports
    "B008",   # function-call-in-default-argument — FastAPI Depends() pattern
    "B027",   # empty-method-without-abstract-decorator
    "ARG002", # unused-method-argument — common in callbacks/handlers
    "ARG001", # unused-function-argument — common in callbacks/handlers
    "ARG005", # unused-lambda-argument — common in lambdas
    "PTH",    # pathlib建议 — functional but noisy, defer migration
    "E741",   # ambiguous-variable-name — mathematical/algorithmic code
    "B904",   # raise-without-from-inside-except — style preference
    "N815",   # mixed-case-variable-in-class-scope — third-party API naming
    "N803",   # invalid-argument-name — API query params use camelCase
    "N801",   # invalid-class-name — third-party naming conventions
    "N814",   # camelcase-imported-as-constant
    "N817",   # camelcase-imported-as-acronym
    "N818",   # error-suffix-on-exception-name
    "SIM105", # suppressible-exception — contextlib.suppress not always clearer
    "F811",   # redefined-while-unused — re-export pattern
    "F402",   # import-shadowed-by-loop-var — common in form handlers
    "B039",   # mutable-contextvar-default
    "E702",   # multiple-statements-on-one-line-colon
    "SIM102", # collapsible-if — readability preference
    "E701",   # multiple-statements-on-one-line-colon — one-liner defs
    "B007",   # unused-loop-control-variable
    "I001",   # unsorted-imports — noisy in __init__ re-exports
    "F821",   # undefined-name — runtime-resolved names (SQLAlchemy, __init__ re-exports)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/runtime_engine", "tests/e2e"]
asyncio_mode = "auto"
# Aligned session loop scope for BOTH fixtures and tests: the suite's
# async_engine fixture is session-scoped (pytest-asyncio requires fixture loop
# scope >= fixture scope), so tests MUST run on the same session event loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "INFO"
addopts = "-v --cov=backend --cov-report=term-missing"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
