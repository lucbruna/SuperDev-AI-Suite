[package]
name = "superdev-wasm-runtime"
version = "5.0.0"
edition = "2021"
description = "SuperDev AI Suite - WebAssembly Runtime Engine"
repository = "https://github.com/superdev/superdev"
license = "MIT OR Apache-2.0"
keywords = ["wasm", "wasmtime", "sandbox", "plugin", "runtime"]
categories = ["development-tools", "webassembly", "embedded"]

[dependencies]
wasmtime = { version = "25.0", features = ["component-model-async", "async", "parallel-compilation", "cranelift", "wat", "wasi-preview1", "wasi-preview2"] }
wasmtime-wasi = { version = "25.0", features = ["async", "sync"] }
wasmtime-wasi-nn = "25.0"
wat = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "uuid-macro"] }
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
thiserror = "1.0"
parking_lot = "0.12"
dashmap = "5.0"
semver = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
wat = "1.0"
tokio-test = "0.4"
pretty_assertions = "1.0"

[features]
default = ["async"]
async = ["wasmtime/async", "tokio/rt-multi-thread"]
sync = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true