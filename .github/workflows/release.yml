name: Release & Deploy

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.3)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: 'Dry run only'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # PREPARE RELEASE
  # ════════════════════════════════════════════════════════════════════════
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      changelog: ${{ steps.generate_changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: generate_changelog
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: '${{ steps.extract_version.outputs.version }}'
            });
            const changelog = commits.commits
              .filter(c => !c.commit.message.startsWith('chore:') && !c.commit.message.startsWith('ci:'))
              .map(c => `- ${c.commit.message.split('\n')[0]} (${c.author?.login || 'unknown'})`)
              .join('\n');
            core.setOutput('changelog', changelog || 'No changes');

      - name: Create Release Notes
        run: |
          cat > release-notes.md << 'EOF'
          # Release ${{ steps.extract_version.outputs.version }}

          ${{ steps.generate_changelog.outputs.changelog }}

          ## Installation
          \`\`\`bash
          pip install superdev==${{ steps.extract_version.outputs.version }}
          \`\`\`

          ## Docker Images
          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.extract_version.outputs.version }}
          \`\`\`
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # ════════════════════════════════════════════════════════════════════════
  # BUILD & PUSH DOCKER IMAGES
  # ════════════════════════════════════════════════════════════════════════
  build-api:
    name: Build API Image
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ needs.prepare-release.outputs.version }}
            ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  build-frontend:
    name: Build Frontend Image
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ needs.prepare-release.outputs.version }}
            ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build Worker Image
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-worker:${{ needs.prepare-release.outputs.version }}
            ghcr.io/${{ github.repository }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════
  # PYTHON PACKAGE
  # ════════════════════════════════════════════════════════════════════════
  build-python-package:
    name: Build Python Package
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build --wheel --sdist
        working-directory: ./backend
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════
  # SDK PACKAGES
  # ════════════════════════════════════════════════════════════════════════
  publish-typescript-sdk:
    name: Publish TypeScript SDK
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: ./sdk/typescript
      - run: npm version ${{ needs.prepare-release.outputs.version }} --no-git-tag-version
        working-directory: ./sdk/typescript
      - run: npm publish --access public
        working-directory: ./sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-go-sdk:
    name: Publish Go SDK
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
        working-directory: ./sdk/go
      - run: |
          sed -i "s/v0.0.0/v${{ needs.prepare-release.outputs.version }}/" go.mod
          go build ./...
        working-directory: ./sdk/go
      - run: GOPROXY=proxy.golang.org go list -m github.com/superdev/sdk/go@v${{ needs.prepare-release.outputs.version }}
        env:
          GOPROXY: proxy.golang.org
          GOSUMDB: sum.golang.org

  publish-rust-sdk:
    name: Publish Rust SDK
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_TOKEN }}
        working-directory: ./sdk/rust

  # ════════════════════════════════════════════════════════════════════════
  # DEPLOYMENT
  # ════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    needs:
      - build-api
      - build-frontend
      - build-worker
      - build-python-package
      - publish-typescript-sdk
      - publish-go-sdk
      - publish-rust-sdk
    if: github.ref_type == 'tag' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          echo "Deploying ${{ needs.prepare-release.outputs.version }} to staging..."
          # kubectl set image deployment/superdev-api api=ghcr.io/${{ github.repository }}-api:${{ needs.prepare-release.outputs.version }} -n superdev-staging
          # kubectl set image deployment/superdev-frontend frontend=ghcr.io/${{ github.repository }}-frontend:${{ needs.prepare-release.outputs.version }} -n superdev-staging
          # kubectl rollout status deployment/superdev-api -n superdev-staging --timeout=300s

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          echo "Deploying ${{ needs.prepare-release.outputs.version }} to production..."
          # ArgoCD will handle the deployment via GitOps
          # Just trigger the sync
          # argocd app sync superdev-platform --prune

  # ════════════════════════════════════════════════════════════════════════
  # FINALIZE RELEASE
  # ════════════════════════════════════════════════════════════════════════
  finalize-release:
    name: Finalize Release
    needs:
      - deploy-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Update GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const notes = fs.readFileSync('release-notes.md', 'utf8');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ github.event.release.id }},
              body: notes
            });

      - name: Create Git tag for latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Notify Release
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_RELEASES_CHANNEL }}
          slack-message: |
            🚀 *SuperDev ${{ needs.prepare-release.outputs.version }} Released!*
            *Released by:* ${{ github.actor }}
            *Docker Images:* ghcr.io/${{ github.repository }}:latest
            *PyPI:* superdev==${{ needs.prepare-release.outputs.version }}
            *NPM:* @superdev/sdk@${{ needs.prepare-release.outputs.version }}
            *Go:* github.com/superdev/sdk/go@v${{ needs.prepare-release.outputs.version }}
            *Crates:* superdev-sdk@${{ needs.prepare-release.outputs.version }}