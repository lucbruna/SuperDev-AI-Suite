name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push backend
        run: |
          docker build -f infrastructure/docker/Dockerfile.backend -t ${{ secrets.ECR_REGISTRY }}/superdev-backend:${{ github.sha }} .
          docker push ${{ secrets.ECR_REGISTRY }}/superdev-backend:${{ github.sha }}
      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster superdev --service backend --force-new-deployment
