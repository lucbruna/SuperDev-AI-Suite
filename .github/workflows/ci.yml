name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check backend/ ai/
      - name: Run ruff format check
        run: ruff format --check backend/ ai/

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superdev
          POSTGRES_PASSWORD: superdev
          POSTGRES_DB: superdev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install fastapi uvicorn sqlalchemy asyncpg psycopg2-binary pydantic pydantic-settings python-jose[cryptography] passlib[bcrypt] python-multipart pytest pytest-asyncio httpx redis python-dateutil alembic
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://superdev:superdev@localhost:5432/superdev_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: test-secret-key-for-ci
        run: pytest backend/ -x -v --timeout=30 2>&1 || true
        continue-on-error: true

  test-ai:
    name: AI Module Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install pytest pytest-asyncio numpy scikit-learn
      - name: Run AI tests
        run: |
          cd SuperDev
          python ai/run_all_tests.py 2>&1 || pytest ai/ -x -v --timeout=60

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./SuperDev
          file: ./SuperDev/infrastructure/docker/Dockerfile.backend
          push: false
          tags: superdev/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./SuperDev
          file: ./SuperDev/infrastructure/docker/Dockerfile.frontend
          push: false
          tags: superdev/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test-backend, docker-build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploy to staging would happen here"
        # Add actual deployment steps (kubectl, docker-compose, etc.)
