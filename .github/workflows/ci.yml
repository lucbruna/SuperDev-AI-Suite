name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - darkstudio/media-engine-audit
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check backend/ ai/
      - name: Run ruff format check
        run: ruff format --check backend/ ai/
      - name: Verify version metadata (./VERSION is single source of truth)
        run: python scripts/sync_version.py --check

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superdev
          POSTGRES_PASSWORD: superdev
          POSTGRES_DB: superdev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install FFmpeg for real MP4 regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install fastapi uvicorn 'sqlalchemy[asyncio]' asyncpg psycopg2-binary pydantic pydantic-settings python-jose[cryptography] passlib[bcrypt] python-multipart pytest pytest-asyncio pytest-timeout numpy 'Pillow>=10,<13' httpx redis python-dateutil alembic pgvector email-validator
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://superdev:superdev@localhost:5432/superdev_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest tests/unit tests/integration -x -v --timeout=30 \
            --ignore=tests/unit/test_ai_router.py \
            --ignore=tests/unit/test_git_tool.py
      - name: Run media-engine regression tests (strict)
        run: pytest tests/unit/test_editing_director.py tests/unit/test_scene_transitions.py tests/unit/test_camera_motion.py tests/unit/test_characters.py tests/unit/test_media_video.py tests/unit/test_scene_narration.py tests/unit/test_audio_mux_duration.py tests/unit/test_studio_profile_pixels.py tests/unit/test_text_to_video_engine_mp4.py tests/unit/test_media_llm.py tests/unit/test_studio_canvas_grading.py tests/unit/test_local_diffusion_provider.py tests/unit/test_studio_api.py tests/unit/test_video_studio_api.py tests/unit/test_tts_engine.py tests/unit/test_subtitle_timing.py tests/unit/test_media_timeline.py tests/unit/test_audio_timeline.py tests/unit/test_av_sync.py tests/unit/test_visual_intelligence.py tests/unit/test_mp4_visual_analysis.py tests/unit/test_video_timeline_api.py tests/unit/test_video_job_store.py tests/unit/test_image_to_video_motion.py tests/unit/test_comfyui_video_provider.py \
            tests/unit/test_mixed_scene_render.py tests/unit/test_studio_profiles.py \
            tests/unit/test_scene_visual_asset_workflow.py tests/unit/test_visual_assets_api.py \
            tests/unit/test_scene_image_candidate_api.py tests/unit/test_backend_lifespan_video_worker.py -q --timeout=60
      - name: Render and validate two-scene DARKSTUDIO MP4
        run: python scripts/darkstudio_render_smoke.py --output /tmp/darkstudio-two-scene-demo.mp4
      - name: Upload two-scene MP4 proof
        uses: actions/upload-artifact@v4
        with:
          name: darkstudio-two-scene-mp4
          path: /tmp/darkstudio-two-scene-demo.mp4
          if-no-files-found: error
      - name: Run end-to-end DARKSTUDIO prompt-to-video smoke test
        run: python scripts/darkstudio_pipeline_smoke.py --output /tmp/darkstudio-pipeline-smoke.mp4
      - name: Upload end-to-end DARKSTUDIO pipeline proof
        uses: actions/upload-artifact@v4
        with:
          name: darkstudio-prompt-to-video-proof
          path: /tmp/darkstudio-pipeline-smoke.mp4
          if-no-files-found: error

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  test-ai:
    name: AI Module Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install pytest pytest-asyncio numpy scikit-learn
      - name: Run AI tests
        run: |
          python ai/run_all_tests.py 2>&1 || pytest ai/ -x -v --timeout=60

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.backend
          push: false
          tags: superdev/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.frontend
          push: false
          tags: superdev/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test-backend, docker-build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploy to staging would happen here"
        # Add actual deployment steps (kubectl, docker-compose, etc.)
