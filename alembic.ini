# Alembic configuration for SuperDev AI Suite
# This file is used to configure Alembic migrations.
# The sqlalchemy.url is overridden by env.py from application config.

[alembic]
# Path to migration scripts
script_location = backend/database/migrations
# Prepend the project root to sys.path so we can find our modules
prepend_sys_path = .
# Version path separator for multi-repo setups
version_path_separator = os
# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Database URL - overridden in env.py from application configuration
# sqlalchemy.url = driver://user:pass@localhost/dbname
sqlalchemy.url = postgresql+asyncpg://superdev:password@localhost:5432/superdev

# Custom version table schema
# version_table_schema = public

# Execute custom SQL scripts before/after migrations
# process_revision_directives = True
# sqlalchemy_echo = False

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S